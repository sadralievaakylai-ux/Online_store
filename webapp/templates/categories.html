{% extends 'base.html' %}

{% block content %}

<h1>Категории</h1>

<div class="categories">
    {% for category in categories %}
        <div class="category-card">
            <h2>{{ category.name }}</h2>

            <a href="{% url 'category_edit' category.pk %}"
               class="edit-button">Edit</a>
        </div>
    {% endfor %}
</div>

{% endblock %}
