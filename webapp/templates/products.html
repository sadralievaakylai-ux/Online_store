{% extends 'base.html' %}

{% block content %}

<h1>Спортивные товары</h1>

<div class="products">
    {% for product in products %}
        <div class="product-card">
            <img src="{{ product.image }}" alt="{{ product.name }}">

            <h2>{{ product.name }}</h2>

            <p>{{ product.category.name }}</p>

            <p class="price">{{ product.price }} сом</p>

            <a href="{% url 'product' product.pk %}">
                Посмотреть больше
            </a>
        </div>
    {% endfor %}
</div>

{% endblock %}
